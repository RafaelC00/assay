<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ASSAY">
  <!-- A sample at level: the circle is the vial, the bar is the meniscus.
       Drawn on a 32 grid with a 4-unit module so it stays crisp at 16px. -->
  <rect width="32" height="32" rx="6" fill="#16201d"/>
  <circle cx="16" cy="16" r="9" fill="none" stroke="#d8cfc0" stroke-width="2.5"/>
  <path d="M8 19h16" stroke="#d8cfc0" stroke-width="2.5" stroke-linecap="butt"/>
</svg>
